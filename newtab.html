<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --search-bg: #ffffff;
      --search-border: #e0e0e5;
      --search-shadow: 0 8px 28px -4px rgba(0,0,0,0.07), 0 3px 8px -2px rgba(0,0,0,0.03);
      --search-focus-border: #b0b0b8;
      --search-focus-shadow: 0 12px 32px -4px rgba(0,0,0,0.10), 0 0 0 3.5px rgba(0,0,0,0.05);
      --text: #18181b;
      --placeholder: #b0b0b8;
      --cat-fill: #1c1c1e;
      --cat-inner-ear: rgba(255,255,255,0.42);
      --eye-bg: #ffffff;
      --pupil-fill: #1c1c1e;
      --cat-detail: #ffffff;
      --cat-stroke-col: #ffffff;
      --zzz-fill: #9e9ea8;
      --bubble-bg: #1c1c1e;
      --bubble-text: #ffffff;
      --blush-fill: rgba(255, 130, 165, 0.5);
      --stripe-fill: rgba(255, 255, 255, 0.35);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0c;
        --search-bg: #1c1c1e;
        --search-border: #2e2e32;
        --search-shadow: 0 8px 32px -4px rgba(0,0,0,0.7), 0 3px 8px -2px rgba(0,0,0,0.5);
        --search-focus-border: #4a4a50;
        --search-focus-shadow: 0 12px 36px -4px rgba(0,0,0,0.8), 0 0 0 3.5px rgba(255,255,255,0.06);
        --text: #f2f2f7;
        --placeholder: #636368;
        --cat-fill: #f0f0f5;
        --cat-inner-ear: rgba(0,0,0,0.22);
        --eye-bg: #1c1c1e;
        --pupil-fill: #f0f0f5;
        --cat-detail: #1c1c1e;
        --cat-stroke-col: #1c1c1e;
        --zzz-fill: #9e9ea8;
        --bubble-bg: #f0f0f5;
        --bubble-text: #1c1c1e;
      --blush-fill: rgba(255, 140, 175, 0.55);
      --stripe-fill: rgba(0, 0, 0, 0.3);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      overflow-y: visible;
      user-select: none;
      transition: background 0.3s;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 560px;
      padding: 0 20px;
    }

    /* ── Cat Wrapper ── */
    .cat-wrapper {
      width: 200px;
      height: 80px;
      position: relative;
      margin-bottom: -14px;
      z-index: 100;
      cursor: pointer;
      transform: translateX(var(--walk-x, 0px));
      transform-origin: center bottom;
      transition: transform 1.6s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
    }
    .cat-svg { width: 100%; height: 100%; overflow: visible; }

    /* ── Clean & Symmetrical Thought Bubble ── */
    .miau-bubble {
      position: absolute;
      top: -44px; left: 50%;
      transform: translateX(-50%) scale(0.5);
      background: var(--bubble-bg);
      color: var(--bubble-text);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px; font-weight: 700; letter-spacing: 0.2px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      opacity: 0; pointer-events: none;
      white-space: nowrap;
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 6px 20px -2px rgba(0,0,0,0.14);
      z-index: 10;
      transition: opacity 0.2s ease, transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .miau-bubble .thought-tail {
      position: absolute;
      top: 100%; left: 50%;
      transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center;
      margin-top: 4px; gap: 3px;
      pointer-events: none;
    }
    .miau-bubble .thought-dot {
      background: var(--bubble-bg);
      border-radius: 50%;
      flex-shrink: 0;
    }
    .miau-bubble .dot-1 { width: 7px; height: 7px; }
    .miau-bubble .dot-2 { width: 4.5px; height: 4.5px; }
    .miau-bubble .dot-3 { width: 3px; height: 3px; }

    .miau-bubble.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
      animation: comicPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, comicFloat 3.2s ease-in-out infinite 0.3s;
    }

    @keyframes comicPop {
      0%   { opacity: 0; transform: translateX(-50%) translateY(10px) scale(0.5) rotate(-3deg); }
      70%  { transform: translateX(-50%) translateY(-3px) scale(1.05) rotate(1deg); }
      100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1) rotate(0deg); }
    }
    @keyframes comicFloat {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50%      { transform: translateX(-50%) translateY(-3px); }
    }


    /* ── SVG Shorthand Classes ── */
    .cf  { fill: var(--cat-fill); }          /* cat body color fill */
    .cd  { fill: var(--cat-detail); }        /* detail/contrast fill */
    .ie  { fill: var(--cat-inner-ear); }     /* inner ear overlay */
    .eb  { fill: var(--eye-bg); }            /* eye sclera */
    .ep  { fill: var(--pupil-fill); }        /* pupil fill */
    /* stroke helpers */
    .cs  { stroke: var(--cat-stroke-col); fill: none; }   /* body-on-decoration stroke */
    .cfs { stroke: var(--cat-fill); fill: none; }         /* eye-on-sclera stroke */

    /* ── Whiskers ── */
    #whiskers line {
      stroke: var(--cat-stroke-col);
      stroke-width: 0.9; stroke-linecap: round;
      opacity: 0.38;
      transition: opacity 0.4s ease;
    }

    /* ── Blush & Extra Details ── */
    .blush {
      fill: var(--blush-fill);
      opacity: 0.85;
      transition: opacity 0.3s ease, transform 0.3s ease;
      transform-origin: center;
    }
    .stripe { fill: var(--stripe-fill); }
    .heart-sparkles { opacity: 0; transition: opacity 0.3s ease; pointer-events: none; }
    .heart-item { opacity: 0; font-weight: 900; }

    /* ── Cat Root: breathing ── */
    #cat-root {
      transform-origin: 100px 53px;
      animation: breathe 2.5s ease-in-out infinite;
    }
    @keyframes breathe {
      0%,100% { transform: scaleY(1); }
      50%      { transform: scaleY(1.019); }
    }

    /* ── Head Assembly ── */
    #catHead {
      transform-origin: 100px 37px;
      transform: rotate(var(--head-tilt, 0deg));
      transition: transform 0.22s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* ── Tail ── */
    #tail {
      transform-origin: 39px 46px;
      animation: tailWag 2.6s ease-in-out infinite;
    }
    @keyframes tailWag {
      0%,100% { transform: rotate(-10deg); }
      50%     { transform: rotate(10deg); }
    }

    /* ── Eye Layers (Smooth & Natural Organic Transition) ── */
    .eye-normal-grp { transition: opacity 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
    .eye-eyelid-fill {
      transform: translateY(-9px);
      transition: transform 0.38s cubic-bezier(0.25, 1, 0.5, 1);
      animation: naturalBlink 4.2s ease-in-out infinite;
    }
    @keyframes naturalBlink {
      0%, 93%, 99%, 100% { transform: translateY(-9px); }
      96%                { transform: translateY(11px); } /* Smooth natural eye blink */
    }
    .eye-lid-line    { opacity: 0; transition: transform 0.34s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
    .pupil-grp       { transition: transform 0.14s cubic-bezier(0.25, 1, 0.5, 1); transform: translate(var(--eye-x,0px),var(--eye-y,0px)); }
    .eye-happy       { opacity: 0; transition: opacity 0.32s cubic-bezier(0.25, 1, 0.5, 1) 0.04s; }
    .eye-sleep       { opacity: 0; transition: opacity 0.35s cubic-bezier(0.25, 1, 0.5, 1) 0.05s; }
    .eye-surprised   { opacity: 0; transition: opacity 0.24s cubic-bezier(0.25, 1, 0.5, 1); }

    /* ── Mouth Layers (Staggered Delay for Organic Expression) ── */
    .mouth-n { transition: opacity 0.28s cubic-bezier(0.25, 1, 0.5, 1); }
    .mouth-h, .mouth-s, .mouth-o { opacity: 0; transition: opacity 0.28s cubic-bezier(0.25, 1, 0.5, 1) 0.05s; }

    /* ── Arms ── */
    #arm-l { transform-origin: 65px 48px; }
    #arm-r { transform-origin: 135px 48px; }
    #arms  { transition: transform 0.45s cubic-bezier(0.34,1.56,0.64,1); }

    /* ══════════════════════════════════
       STATE MACHINE
    ══════════════════════════════════ */

    /* Ear base anchored at (58, 25) and (142, 25) deep inside body rect */
    #ear-l { transform-origin: 58px 25px; transition: transform 0.38s cubic-bezier(0.34, 1.4, 0.64, 1) 0.02s; }
    #ear-r { transform-origin: 142px 25px; transition: transform 0.38s cubic-bezier(0.34, 1.4, 0.64, 1) 0.07s; }

    /* — AWAKE: alert, eyes wide open — */
    .state-awake #ear-l { animation: earTwitchL 0.42s cubic-bezier(0.34,1.56,0.64,1); }
    .state-awake #ear-r { animation: earTwitchR 0.42s cubic-bezier(0.34,1.56,0.64,1) 0.07s; }
    @keyframes earTwitchL {
      0%,100% { transform: rotate(0deg); }
      30%     { transform: rotate(-14deg); }
      70%     { transform: rotate(5deg); }
    }
    @keyframes earTwitchR {
      0%,100% { transform: rotate(0deg); }
      30%     { transform: rotate(14deg); }
      70%     { transform: rotate(-5deg); }
    }
    .state-awake .eye-eyelid-fill { transform: translateY(-9px); }
    .state-awake .eye-lid-line    { opacity: 0; }
    .state-awake #whiskers line   { opacity: 0.65; }

    /* — TYPING: focused, half-lidded, rhythmic kneading paws — */
    .state-typing .eye-eyelid-fill { animation: none; transform: translateY(2px); }
    .state-typing .eye-lid-line    { transform: translateY(1.5px); opacity: 1; }
    .state-typing #arm-l { animation: kneadL 0.75s ease-in-out infinite; }
    .state-typing #arm-r { animation: kneadR 0.75s ease-in-out infinite 0.375s; }
    @keyframes kneadL {
      0%,100% { transform: translateY(0) rotate(0deg); }
      50%     { transform: translateY(-2.5px) rotate(-3deg); }
    }
    @keyframes kneadR {
      0%,100% { transform: translateY(-2.5px) rotate(3deg); }
      50%     { transform: translateY(0) rotate(0deg); }
    }
    .state-typing #whiskers line { opacity: 0.55; }

    /* — HAPPY & HOVER: happy curved eyes & smiling mouth — */
    .state-happy .eye-normal-grp,
    .state-hover .eye-normal-grp { opacity: 0; }
    .state-happy .eye-happy,
    .state-hover .eye-happy      { opacity: 1; }
    .state-happy .mouth-n,
    .state-hover .mouth-n        { opacity: 0; }
    .state-happy .mouth-h,
    .state-hover .mouth-h        { opacity: 1; }
    .state-happy .blush,
    .state-hover .blush          { opacity: 1; }

    .state-happy #cat-root       { animation: petSquish 0.48s cubic-bezier(0.34,1.56,0.64,1); }
    .state-happy #ear-l          { animation: petEarL 0.48s ease-in-out; }
    .state-happy #ear-r          { animation: petEarR 0.48s ease-in-out; }
    .state-happy #whiskers line  { opacity: 0.80; }

    /* — HOVER: subtle, clean reaction when cursor passes over cat — */
    .state-hover #ear-l          { transform: rotate(-7deg); transition: transform 0.25s ease; }
    .state-hover #ear-r          { transform: rotate(7deg); transition: transform 0.25s ease; }
    .state-hover #tail           { animation: tailWag 1.8s ease-in-out infinite; }
    .state-hover #whiskers line  { opacity: 0.8; }
    .state-hover .heart-sparkles { opacity: 1; }
    .state-hover .heart-1        { animation: floatHeart 1.4s ease-in-out infinite 0s; }
    .state-hover .heart-2        { animation: floatHeart 1.4s ease-in-out infinite 0.5s; }

    @keyframes floatHeart {
      0%   { opacity: 0; transform: translateY(4px) scale(0.6); }
      35%  { opacity: 0.85; }
      100% { opacity: 0; transform: translateY(-15px) scale(1.1); }
    }
    @keyframes petSquish {
      0%   { transform: scale(1,1); }
      35%  { transform: scale(1.09,0.87); }
      65%  { transform: scale(0.97,1.05); }
      100% { transform: scale(1,1); }
    }
    @keyframes petEarL {
      0%,100% { transform: rotate(0deg); }
      40%     { transform: rotate(-15deg); }
    }
    @keyframes petEarR {
      0%,100% { transform: rotate(0deg); }
      40%     { transform: rotate(15deg); }
    }

    /* — PLAYING / KICKING: Dynamic Left & Right Paw Kicks — */
    .kick-left #arm-l  { animation: kickPawL 0.65s cubic-bezier(0.34,1.56,0.64,1); }
    .kick-right #arm-r { animation: kickPawR 0.65s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes kickPawL {
      0%,100% { transform: translateY(0) rotate(0deg); }
      38%     { transform: translateY(-14px) rotate(34deg) translateX(-9px); }
      70%     { transform: translateY(2px) rotate(-12deg); }
    }
    @keyframes kickPawR {
      0%,100% { transform: translateY(0) rotate(0deg); }
      38%     { transform: translateY(-14px) rotate(-34deg) translateX(9px); }
      70%     { transform: translateY(2px) rotate(12deg); }
    }
    .state-playing .eye-eyelid-fill { transform: translateY(-9px); }
    .state-playing .eye-lid-line    { opacity: 0; }
    .state-playing .mouth-n         { opacity: 0; }
    .state-playing .mouth-o         { opacity: 1; }
    .state-playing #whiskers line   { opacity: 0.75; }
    .toy-ball { opacity: 0; }
    .state-playing .toy-ball { animation: toyPlay 0.75s ease-in-out; }
    @keyframes toyPlay {
      0%   { opacity:0; transform: translate(148px,62px) scale(0.2); }
      38%  { opacity:1; transform: translate(164px,48px) scale(1); }
      72%  { opacity:1; transform: translate(175px,58px) scale(1.12); }
      100% { opacity:0; transform: translate(168px,62px) scale(0.2); }
    }

    /* — SURPRISED: momentary wide eyes — */
    .state-surprised .eye-normal-grp { opacity: 0; }
    .state-surprised .eye-surprised  { opacity: 1; }
    .state-surprised .eye-lid-line   { opacity: 0; }
    .state-surprised #cat-root       { animation: surpriseJolt 0.28s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes surpriseJolt {
      0%,100% { transform: scale(1); }
      45%     { transform: scale(1.04,0.96); }
    }
    .state-surprised #ear-l { animation: surpriseEarL 0.28s cubic-bezier(0.34,1.56,0.64,1); }
    .state-surprised #ear-r { animation: surpriseEarR 0.28s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes surpriseEarL {
      0%,100% { transform: rotate(0deg); }
      50%     { transform: rotate(-16deg); }
    }
    @keyframes surpriseEarR {
      0%,100% { transform: rotate(0deg); }
      50%     { transform: rotate(16deg); }
    }

    /* — FRUSTRATED: backspace deletion annoyance — */
    .state-frustrated .eye-eyelid-fill { animation: none; transform: translateY(2.5px); }
    .state-frustrated #ear-l           { transform: rotate(-12deg); transition: transform 0.2s ease; }
    .state-frustrated #ear-r           { transform: rotate(12deg); transition: transform 0.2s ease; }
    .state-frustrated .mouth-n         { opacity: 0; }
    .state-frustrated .mouth-s         { opacity: 1; }
    .state-frustrated #whiskers line   { opacity: 0.8; }

    /* — WALKING: organic non-linear stroll along X-axis — */
    .state-walking #arm-l { animation: walkStepL 0.32s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
    .state-walking #arm-r { animation: walkStepR 0.32s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite 0.16s; }
    .state-walking #cat-root { animation: walkBob 0.32s cubic-bezier(0.34, 1.4, 0.64, 1) infinite; }
    .state-walking #tail { animation: tailWag 1.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }

    @keyframes walkStepL {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(-2.8px); }
    }
    @keyframes walkStepR {
      0%, 100% { transform: translateY(-2.8px); }
      50%      { transform: translateY(0px); }
    }
    @keyframes walkBob {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(-1.5px); }
    }

    /* — SLEEPING — */
    .state-sleeping .eye-normal-grp { opacity: 0; }
    .state-sleeping .eye-lid-line   { opacity: 0; }
    .state-sleeping .eye-sleep      { opacity: 1; }
    .state-sleeping .mouth-n        { opacity: 0; }
    .state-sleeping .mouth-s        { opacity: 1; }
    .state-sleeping #tail           { animation-duration: 6s; }
    .state-sleeping #arms           { transform: translateY(5px); }
    .state-sleeping #whiskers line  { opacity: 0.18; }

    /* Zzz group */
    .zzz-group { opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }
    .state-sleeping .zzz-group { opacity: 1; }
    .zzz-item { font-weight: 800; fill: var(--zzz-fill); opacity: 0; font-family: -apple-system,sans-serif; }
    .state-sleeping .zzz-1 { animation: floatZ 2.8s ease-in-out infinite 0.0s; }
    .state-sleeping .zzz-2 { animation: floatZ 2.8s ease-in-out infinite 0.9s; }
    .state-sleeping .zzz-3 { animation: floatZ 2.8s ease-in-out infinite 1.8s; }
    @keyframes floatZ {
      0%   { opacity:0; transform: translateY(0) scale(0.7); }
      35%  { opacity:0.82; }
      100% { opacity:0; transform: translateY(-26px) translateX(9px) scale(1.18); }
    }

    /* ── Search Bar & Pixel-Locked Autocomplete Overlay ── */
    .search-wrapper {
      width: 100%; position: relative; z-index: 1;
      transition: transform 0.16s cubic-bezier(0.34,1.56,0.64,1);
      will-change: transform;
    }
    .search-wrapper.submitting { transform: scale(0.97); }
    .search-form {
      width: 100%; position: relative;
      background: var(--search-bg);
      border-radius: 999px;
      height: 52px;
      box-shadow: var(--search-shadow);
      transition: box-shadow 0.22s ease;
      overflow: hidden;
    }
    .search-form-reflection {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 999px;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.2s ease;
      will-change: opacity, background;
    }
    .search-form:focus-within {
      box-shadow: var(--search-focus-shadow);
    }
    .ghost-overlay, .search-input {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
      font-size: 16px !important;
      font-weight: 400 !important;
      letter-spacing: 0px !important;
      line-height: 52px !important;
      padding: 0 24px 0 50px !important;
      margin: 0 !important;
      box-sizing: border-box !important;
      white-space: pre !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .ghost-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      height: 52px;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
      display: block;
    }
    .ghost-typed {
      color: transparent !important;
      user-select: none;
    }
    .ghost-hint {
      color: var(--placeholder);
      opacity: 0.55;
      font-weight: 400;
      user-select: none;
    }
    .search-input {
      width: 100%; height: 52px;
      background: transparent !important;
      border: none !important;
      border-radius: 999px;
      color: var(--text);
      outline: none !important;
      outline-style: none !important;
      -webkit-appearance: none;
      appearance: none;
      position: relative;
      z-index: 2;
    }
    .search-input::placeholder { color: var(--placeholder); font-weight: 400; }
    .search-input:focus, .search-input:focus-visible, .search-input:active {
      outline: none !important;
      outline-offset: 0 !important;
      border: none !important;
    }
    .search-icon {
      position: absolute; left: 20px; top: 17px; width: 18px; height: 18px;
      fill: none; stroke: var(--placeholder); stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round;
      pointer-events: none; transition: stroke 0.2s;
      z-index: 4;
    }
    .search-input:focus ~ .search-icon { stroke: var(--text); }
    .shortcut-badge {
      position: absolute; right: 18px; top: 14px;
      background: var(--bg); border: 1px solid var(--search-border);
      color: var(--placeholder); border-radius: 6px;
      padding: 2px 7px; font-size: 12px; font-weight: 500;
      pointer-events: none; transition: opacity 0.2s;
      z-index: 4;
    }
    .search-input:focus ~ .shortcut-badge { opacity: 0; }
    .paste-btn {
      position: absolute;
      right: 46px;
      top: 14px;
      width: 24px;
      height: 24px;
      background: none;
      border: none;
      color: var(--placeholder);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.55;
      z-index: 5;
      padding: 0;
      transition: opacity 0.2s ease, color 0.2s ease, transform 0.15s ease;
    }
    .paste-btn:hover {
      opacity: 1;
      color: var(--text);
      transform: scale(1.1);
    }
    .paste-svg {
      width: 15px;
      height: 15px;
    }
    .search-input:focus ~ .paste-btn {
      opacity: 0.85;
    }

    /* ── Sleek Lowercase Shortcut Links & Underline ── */
    .shortcuts-row {
      margin-top: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      z-index: 10;
      position: relative;
      transition: transform 0.16s ease-out;
    }
    .shortcut-link {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      opacity: 0.75;
      text-decoration: none;
      text-transform: lowercase;
      position: relative;
      padding: 2px 0;
      letter-spacing: 0.3px;
      transition: opacity 0.22s ease, color 0.22s ease;
    }
    .shortcut-link::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 1.5px;
      background: var(--text);
      transform: scaleX(0.3);
      transform-origin: center;
      opacity: 0.4;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
    }
    .shortcut-link:hover {
      opacity: 1;
      color: var(--text);
    }
    .shortcut-link:hover::after {
      transform: scaleX(1);
      opacity: 1;
    }
    .shortcut-dot {
      color: var(--placeholder);
      opacity: 0.35;
      font-size: 10px;
      user-select: none;
    }

    /* ── Minimalist Floating Paw Settings Icon (No Container / No Outline) ── */
    .settings-btn {
      position: fixed;
      bottom: 24px;
      left: 24px;
      width: 28px;
      height: 28px;
      padding: 0;
      background: none !important;
      border: none !important;
      box-shadow: none !important;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 120;
      opacity: 0.45;
      transition: opacity 0.22s ease, transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .settings-btn:hover {
      opacity: 0.95;
      transform: scale(1.15) rotate(6deg);
    }
    .paw-svg { width: 24px; height: 24px; }

    /* ── Simple & Elegant Settings Modal ── */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      width: 360px;
      max-width: 90vw;
      background: var(--bg);
      border: 1px solid var(--search-border);
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3);
      padding: 20px 22px;
      color: var(--text);
      box-sizing: border-box;
      transform: scale(0.95) translateY(6px);
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .modal-overlay.open .modal-card {
      transform: scale(1) translateY(0);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .modal-title {
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 7px;
      text-transform: lowercase;
      opacity: 0.8;
      letter-spacing: 0.2px;
    }
    .modal-paw-svg { width: 16px; height: 16px; color: var(--text); }
    .modal-close-btn {
      background: none; border: none;
      font-size: 20px; color: var(--text); opacity: 0.4;
      cursor: pointer; transition: opacity 0.2s; padding: 0;
      line-height: 1;
    }
    .modal-close-btn:hover { opacity: 1; }

    /* Modal Form: Perfect Grid Fit */
    .modal-add-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    .modal-input-row {
      display: flex;
      gap: 8px;
    }
    .modal-input {
      width: 100%;
      height: 34px;
      border-radius: 8px;
      border: 1px solid var(--search-border);
      background: var(--search-bg);
      color: var(--text);
      padding: 0 12px;
      font-size: 12px;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .modal-input:focus { border-color: var(--text); }
    .modal-input-name { flex: 1; }
    .modal-add-btn {
      height: 34px;
      padding: 0 14px;
      border-radius: 8px;
      border: none;
      background: var(--text);
      color: var(--bg);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-transform: lowercase;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }
    .modal-add-btn:hover { opacity: 0.85; }

    /* Custom Sleek Scrollbar & Clean List */
    .shortcuts-manage-list {
      max-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 12px;
      padding-right: 4px;
    }
    .shortcuts-manage-list::-webkit-scrollbar {
      width: 3px;
    }
    .shortcuts-manage-list::-webkit-scrollbar-track {
      background: transparent;
    }
    .shortcuts-manage-list::-webkit-scrollbar-thumb {
      background: rgba(128, 128, 128, 0.25);
      border-radius: 3px;
    }
    .shortcut-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      transition: background 0.15s ease;
    }
    .shortcut-item-row:hover {
      background: rgba(128, 128, 128, 0.07);
    }
    .shortcut-item-info {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }
    .shortcut-item-title {
      font-weight: 500;
      text-transform: lowercase;
      color: var(--text);
    }
    .shortcut-item-url {
      font-size: 11px;
      opacity: 0.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }
    .shortcut-item-del {
      background: none;
      border: none;
      color: var(--text);
      font-size: 15px;
      cursor: pointer;
      opacity: 0.35;
      padding: 2px 6px;
      border-radius: 4px;
      line-height: 1;
      transition: opacity 0.2s, color 0.2s;
    }
    .shortcut-item-del:hover { opacity: 1; color: #ef4444; }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      padding-top: 8px;
    }
    .modal-reset-btn {
      background: none;
      border: none;
      color: var(--placeholder);
      font-size: 11px;
      cursor: pointer;
      text-transform: lowercase;
      opacity: 0.5;
      transition: opacity 0.2s;
      padding: 0;
    }
    .modal-reset-btn:hover { opacity: 0.9; text-decoration: underline; }

    /* ── Physics Toy Ball ── */
    .physics-ball {
      position: fixed !important;
      width: 22px !important;
      height: 22px !important;
      border-radius: 50% !important;
      border: none !important;
      outline: none !important;
      pointer-events: none !important;
      z-index: 50 !important;
      transform: translate(-50%, -50%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2) !important;
      will-change: left, top;
    }
    .physics-ball::before {
      content: '';
      position: absolute;
      top: 3px; left: 3px; right: 3px; bottom: 3px;
      border-radius: 50%;
      border: 1.5px dashed rgba(255,255,255,0.45);
      pointer-events: none;
    }
    .physics-ball::after {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.75);
      position: absolute;
      top: 3px;
      left: 4px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <div class="cat-wrapper" id="catWrapper">
      <div class="miau-bubble" id="miauBubble">
        <span id="miauBubbleText">miau~</span>
        <div class="thought-tail">
          <span class="thought-dot dot-1"></span>
          <span class="thought-dot dot-2"></span>
          <span class="thought-dot dot-3"></span>
        </div>
      </div>

      <svg class="cat-svg" id="catSvg" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="eye-clip-l">
            <circle cx="74" cy="38" r="7.5"/>
          </clipPath>
          <clipPath id="eye-clip-r">
            <circle cx="126" cy="38" r="7.5"/>
          </clipPath>
        </defs>

        <!-- Floating Zzz -->
        <g class="zzz-group">
          <text class="zzz-item zzz-1" x="150" y="22" font-size="9.5">z</text>
          <text class="zzz-item zzz-2" x="158" y="13" font-size="11.5">z</text>
          <text class="zzz-item zzz-3" x="168" y="4"  font-size="14">Z</text>
        </g>

        <!-- Toy Ball -->
        <circle class="toy-ball cf" cx="0" cy="0" r="5.5"/>

        <!-- ══ CAT ROOT (breathing) ══ -->
        <g id="cat-root">

          <!-- ── TAIL (filled path, tapers to tip) ── -->
          <g id="tail">
            <path class="cf" d="
              M 40,47
              C 27,43 16,28 22,15
              C 23,12 27,11 29,14
              C 28,21 33,38 42,50
              Z
            "/>
          </g>

          <!-- ══ HEAD ASSEMBLY: body + ears + face all tilt together ══ -->
          <g id="catHead">

            <!-- ── BODY LOAF & CHEEK TUFTS ── -->
            <g id="body">
              <rect class="cf" x="26" y="23" width="148" height="38" rx="20"/>
              <!-- Fluffy cheek tufts -->
              <path class="cf" d="M 28,34 L 20,39 L 27,42 L 21,46 L 29,48 Z"/>
              <path class="cf" d="M 172,34 L 180,39 L 173,42 L 179,46 L 171,48 Z"/>
              <!-- Soft chest tuft -->
              <path class="ie" d="M 88,48 Q 100,56 112,48 Q 100,52 88,48 Z" opacity="0.65"/>
            </g>

            <!-- TABBY FOREHEAD STRIPES -->
            <g id="stripes">
              <path class="stripe" d="M 96,24 Q 100,28 104,24 Q 100,26 96,24 Z" opacity="0.6"/>
              <path class="stripe" d="M 90,26 Q 94,30 96,27 Q 93,27 90,26 Z" opacity="0.4"/>
              <path class="stripe" d="M 110,26 Q 106,30 104,27 Q 107,27 110,26 Z" opacity="0.4"/>
            </g>

            <!-- EARS: bases extend down to y=26 so they overlap deep inside body rect (zero floating gap) -->
            <g id="ears">
              <g id="ear-l">
                <path class="cf" d="M 44,26 C 42,12 52,2 62,3 C 71,4 73,16 72,26 Z"/>
                <path class="ie" d="M 48,25 C 47,14 54,6 61,7 C 67,8 68,17 67,25 Z"/>
              </g>
              <g id="ear-r">
                <path class="cf" d="M 128,26 C 127,16 129,4 138,3 C 148,2 158,12 156,26 Z"/>
                <path class="ie" d="M 133,25 C 132,17 133,8 139,7 C 146,6 153,14 152,25 Z"/>
              </g>
            </g>

            <!-- WHISKERS: 3 each side, natural angles -->
            <g id="whiskers">
              <line x1="70" y1="37" x2="42" y2="32"/>
              <line x1="70" y1="41" x2="41" y2="41"/>
              <line x1="70" y1="45" x2="42" y2="50"/>
              <line x1="130" y1="37" x2="158" y2="32"/>
              <line x1="130" y1="41" x2="159" y2="41"/>
              <line x1="130" y1="45" x2="158" y2="50"/>
            </g>

            <!-- ── LEFT EYE ── -->
            <g id="eye-l">
              <g class="eye-normal-grp">
                <circle class="eb" cx="74" cy="38" r="7.5"/>
                <g clip-path="url(#eye-clip-l)">
                  <g class="pupil-grp">
                    <circle class="ep" cx="74" cy="38" r="4.3"/>
                    <circle fill="var(--eye-bg)" cx="72.0" cy="35.8" r="1.5"/>
                    <circle fill="var(--eye-bg)" cx="75.8" cy="40.0" r="0.8" opacity="0.85"/>
                  </g>
                  <rect class="cf eye-eyelid-fill" x="62" y="20" width="24" height="18"/>
                </g>
                <path class="cfs eye-lid-line" d="M 66.5,35.5 Q 74,32.2 81.5,35.5" stroke-width="1.4" stroke-linecap="round"/>
              </g>
              <path class="eye-happy" d="M 66.8,39 Q 74,31.8 81.2,39" stroke="var(--cat-detail)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
              <path class="eye-sleep" d="M 67,37 Q 74,43.2 81,37" stroke="var(--cat-detail)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
              <g class="eye-surprised">
                <circle class="eb" cx="74" cy="38" r="8.2"/>
                <circle class="ep" cx="74" cy="38" r="5.2"/>
                <circle fill="var(--eye-bg)" cx="71.8" cy="35.2" r="1.8"/>
                <circle fill="var(--eye-bg)" cx="76.0" cy="40.0" r="0.9" opacity="0.85"/>
              </g>
            </g>

            <!-- ── RIGHT EYE ── -->
            <g id="eye-r">
              <g class="eye-normal-grp">
                <circle class="eb" cx="126" cy="38" r="7.5"/>
                <g clip-path="url(#eye-clip-r)">
                  <g class="pupil-grp">
                    <circle class="ep" cx="126" cy="38" r="4.3"/>
                    <circle fill="var(--eye-bg)" cx="124.0" cy="35.8" r="1.5"/>
                    <circle fill="var(--eye-bg)" cx="127.8" cy="40.0" r="0.8" opacity="0.85"/>
                  </g>
                  <rect class="cf eye-eyelid-fill" x="114" y="20" width="24" height="18"/>
                </g>
                <path class="cfs eye-lid-line" d="M 118.5,35.5 Q 126,32.2 133.5,35.5" stroke-width="1.4" stroke-linecap="round"/>
              </g>
              <path class="eye-happy" d="M 118.8,39 Q 126,31.8 133.2,39" stroke="var(--cat-detail)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
              <path class="eye-sleep" d="M 119,37 Q 126,43.2 133,37" stroke="var(--cat-detail)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
              <g class="eye-surprised">
                <circle class="eb" cx="126" cy="38" r="8.2"/>
                <circle class="ep" cx="126" cy="38" r="5.2"/>
                <circle fill="var(--eye-bg)" cx="123.8" cy="35.2" r="1.8"/>
                <circle fill="var(--eye-bg)" cx="128.0" cy="40.0" r="0.9" opacity="0.85"/>
              </g>
            </g>

            <!-- NOSE: tiny heart shape -->
            <g id="nose">
              <path class="cd" d="
                M 100,44.6
                C 100,43.9 99.4,43.2 98.6,43.2
                C 97.5,43.2 97.0,44.3 98.5,45.7
                Q 100,47.1 101.5,45.7
                C 103.0,44.3 102.5,43.2 101.4,43.2
                C 100.6,43.2 100,43.9 100,44.6 Z
              "/>
            </g>

            <!-- MOUTH variants -->
            <g id="mouth">
              <!-- Normal: double-curve w -->
              <path class="cs mouth-n"
                d="M 93,50.5 Q 96.5,54 100,50.5 Q 103.5,54 107,50.5"
                stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
              <!-- Happy: wide smile arc -->
              <path class="cs mouth-h"
                d="M 91,49.5 Q 100,57 109,49.5"
                stroke-width="1.35" stroke-linecap="round"/>
              <!-- Sleeping: flat neutral -->
              <path class="cs mouth-s"
                d="M 96,51.5 Q 100,52 104,51.5"
                stroke-width="1.1" stroke-linecap="round"/>
              <!-- Surprised/playing: small open oval -->
              <ellipse class="cs mouth-o" cx="100" cy="52" rx="3.5" ry="2.5"
                stroke-width="1.1"/>
            </g>

            <!-- ROSY BLUSH CHEEKS -->
            <g id="blush-cheeks">
              <ellipse class="blush" cx="62" cy="46" rx="5.5" ry="3"/>
              <ellipse class="blush" cx="138" cy="46" rx="5.5" ry="3"/>
            </g>

            <!-- SUBTLE FLOATING HEARTS & SPARKLES -->
            <g class="heart-sparkles">
              <path class="heart-item heart-1" d="M 148,22 C 148,19 145,17 143,19 C 141,17 138,19 138,22 C 138,25 143,28 143,28 C 143,28 148,25 148,22 Z" fill="#ff7096"/>
              <path class="heart-item heart-2" d="M 58,18 C 58,16 56,14 54,16 C 52,14 50,16 50,18 C 50,20 54,23 54,23 C 54,23 58,20 58,18 Z" fill="#ff9ebb"/>
            </g>

          </g><!-- /catHead -->

          <!-- ── ARMS / PAWS (dangling over search bar with full toe bean detail) ── -->
          <g id="arms">
            <g id="arm-l">
              <rect class="cf" x="52" y="48" width="26" height="28" rx="13"/>
              <!-- Main palm pad + 3 toe beans -->
              <ellipse class="cd" cx="65" cy="67" rx="4.8" ry="3.2"/>
              <circle class="cd" cx="58" cy="71" r="2.0"/>
              <circle class="cd" cx="65" cy="73" r="2.2"/>
              <circle class="cd" cx="72" cy="71" r="2.0"/>
            </g>
            <g id="arm-r">
              <rect class="cf" x="122" y="48" width="26" height="28" rx="13"/>
              <!-- Main palm pad + 3 toe beans -->
              <ellipse class="cd" cx="135" cy="67" rx="4.8" ry="3.2"/>
              <circle class="cd" cx="128" cy="71" r="2.0"/>
              <circle class="cd" cx="135" cy="73" r="2.2"/>
              <circle class="cd" cx="142" cy="71" r="2.0"/>
            </g>
          </g>

        </g><!-- /cat-root -->
      </svg>
    </div>

    <!-- ── Search Bar ── -->
    <div class="search-wrapper" id="searchWrapper">
      <form class="search-form" id="searchForm">
        <div class="search-form-reflection" id="searchReflection"></div>
        <div class="ghost-overlay" id="ghostOverlay">
          <span class="ghost-typed" id="ghostTyped"></span><span class="ghost-hint" id="ghostHint"></span>
        </div>
        <input type="text" class="search-input" id="searchInput"
          placeholder="Search Google or press / to focus"
          autocomplete="off" autofocus/>
        <svg class="search-icon" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7"/>
          <line x1="16.5" y1="16.5" x2="21" y2="21"/>
        </svg>
        <span class="shortcut-badge">/</span>
      </form>
    </div>

    <!-- ── Lowercase Website Shortcuts ── -->
    <div class="shortcuts-row" id="shortcutsRow"></div>
  </div>

  <!-- ── Bottom Left Settings Button (Paw Icon) ── -->
  <button class="settings-btn" id="settingsBtn" title="Customize Shortcuts" aria-label="Customize Shortcuts">
    <svg viewBox="0 0 100 100" class="paw-svg" fill="currentColor">
      <path d="M 50 48 C 30 48 18 64 25 80 C 30 92 42 96 50 96 C 58 96 70 92 75 80 C 82 64 70 48 50 48 Z"/>
      <ellipse cx="20" cy="42" rx="9" ry="14" transform="rotate(-28 20 42)"/>
      <ellipse cx="40" cy="22" rx="10" ry="16" transform="rotate(-10 40 22)"/>
      <ellipse cx="60" cy="22" rx="10" ry="16" transform="rotate(10 60 22)"/>
      <ellipse cx="80" cy="42" rx="9" ry="14" transform="rotate(28 80 42)"/>
    </svg>
  </button>

  <!-- ── Settings Modal ── -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">
          <svg viewBox="0 0 100 100" class="modal-paw-svg" fill="currentColor">
            <path d="M 50 48 C 30 48 18 64 25 80 C 30 92 42 96 50 96 C 58 96 70 92 75 80 C 82 64 70 48 50 48 Z"/>
            <ellipse cx="20" cy="42" rx="9" ry="14" transform="rotate(-28 20 42)"/>
            <ellipse cx="40" cy="22" rx="10" ry="16" transform="rotate(-10 40 22)"/>
            <ellipse cx="60" cy="22" rx="10" ry="16" transform="rotate(10 60 22)"/>
            <ellipse cx="80" cy="42" rx="9" ry="14" transform="rotate(28 80 42)"/>
          </svg>
          shortcuts
        </div>
        <button class="modal-close-btn" id="modalCloseBtn" aria-label="Close">&times;</button>
      </div>

      <!-- Add New Link -->
      <form class="modal-add-form" id="addShortcutForm">
        <input type="url" id="newShortcutUrl" placeholder="url" required class="modal-input" />
        <div class="modal-input-row">
          <input type="text" id="newShortcutTitle" placeholder="name" class="modal-input modal-input-name" />
          <button type="submit" class="modal-add-btn">add</button>
        </div>
      </form>

      <!-- Manage List -->
      <div class="shortcuts-manage-list" id="shortcutsManageList"></div>

      <div class="modal-footer">
        <button class="modal-reset-btn" id="modalResetBtn">reset defaults</button>
      </div>
    </div>
  </div>

  <script src="newtab.js"></script>
</body>
</html>
