<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2c2e" />
      <stop offset="100%" stop-color="#121214" />
    </linearGradient>
    <!-- Glass Highlight -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- CAT HEAD & BODY SILHOUETTE -->
  <g transform="translate(0, 4)">
    <!-- Cat Ears -->
    <!-- Left Ear -->
    <path d="M 32 46 C 30 30 42 18 52 20 C 60 21 62 34 62 46 Z" fill="#f0f0f5" />
    <path d="M 36 45 C 35 33 43 23 50 25 C 56 26 57 36 57 45 Z" fill="rgba(0,0,0,0.22)" />

    <!-- Right Ear -->
    <path d="M 96 46 C 98 30 86 18 76 20 C 68 21 66 34 66 46 Z" fill="#f0f0f5" />
    <path d="M 92 45 C 93 33 85 23 78 25 C 72 26 71 36 71 45 Z" fill="rgba(0,0,0,0.22)" />

    <!-- Cat Head Base (Rounded loaf & Cheek tufts) -->
    <rect x="24" y="38" width="80" height="48" rx="24" fill="#f0f0f5" />
    <path d="M 26 48 L 18 53 L 25 57 Z" fill="#f0f0f5" />
    <path d="M 102 48 L 110 53 L 103 57 Z" fill="#f0f0f5" />

    <!-- Forehead Tabby Stripes -->
    <path d="M 61 40 Q 64 43 67 40" stroke="rgba(0,0,0,0.18)" stroke-width="1.6" fill="none" stroke-linecap="round" />

    <!-- Eyes (Cute wide eyes with highlights) -->
    <!-- Left Eye -->
    <circle cx="48" cy="56" r="8" fill="#1c1c1e" />
    <circle cx="50.5" cy="53.5" r="2.8" fill="#ffffff" />

    <!-- Right Eye -->
    <circle cx="80" cy="56" r="8" fill="#1c1c1e" />
    <circle cx="82.5" cy="53.5" r="2.8" fill="#ffffff" />

    <!-- Rosy Blush Cheeks -->
    <ellipse cx="38" cy="62" rx="5" ry="3" fill="rgba(255, 120, 160, 0.45)" />
    <ellipse cx="90" cy="62" rx="5" ry="3" fill="rgba(255, 120, 160, 0.45)" />

    <!-- Nose -->
    <polygon points="64,65 61,62 67,62" fill="#1c1c1e" />

    <!-- Mouth ('w' mouth) -->
    <path d="M 59 66 Q 61.5 69.5 64 66 Q 66.5 69.5 69 66" stroke="#1c1c1e" stroke-width="1.8" stroke-linecap="round" fill="none" />

    <!-- Whiskers -->
    <line x1="28" y1="58" x2="16" y2="55" stroke="#1c1c1e" stroke-width="1.6" stroke-linecap="round" opacity="0.6" />
    <line x1="28" y1="62" x2="15" y2="63" stroke="#1c1c1e" stroke-width="1.6" stroke-linecap="round" opacity="0.6" />
    <line x1="100" y1="58" x2="112" y2="55" stroke="#1c1c1e" stroke-width="1.6" stroke-linecap="round" opacity="0.6" />
    <line x1="100" y1="62" x2="113" y2="63" stroke="#1c1c1e" stroke-width="1.6" stroke-linecap="round" opacity="0.6" />

    <!-- Magnifying Glass Motif (Search icon accent overlay) -->
    <g transform="translate(56, 42)">
      <circle cx="28" cy="28" r="16" fill="url(#glassGrad)" stroke="#38bdf8" stroke-width="3.5" />
      <line x1="39" y1="39" x2="50" y2="50" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" />
    </g>
  </g>
</svg>
